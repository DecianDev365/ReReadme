<!DOCTYPE html>
<html lang ="en">
	<head>
		<meta charset="UTF-8">
		<meta name ="viewport" content="width=device-width,initial-scale=1.0">
		<title>ReReadme | Editor</title>
		<link rel ="stylesheet" href="style.css">
	</head>
	<script src ="script.js"></script>
	<body>
		
		<header>
			<nav class="navbar">
				<div class="logo">
					<a href="index.html">ReReadme </a>
				</div>

			

			</nav>

		</header>

		<main>
			<section id ="editor" class ="editor-section">
				<div class ="editor-header">
					<h1>Refine your README</h1>
					<p>Paste your existing README below.ReReadme will then take care of thee rest.</p>
				</div>
				<textarea
				id="readmeInput"
				placeholder="Paste your README.md"
				spellcheck="false"
				></textarea>



				<div class ="refine-container">
					<button id ="refineBtn" type ="button">
						Refine
					</button>
					<button id="clearBtn" type="button">Clear</button>
				</div>
			</section>

		</main>
		
	</body>
</html>
